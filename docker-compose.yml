services:
  labels:
    build: .
    ports:
      - "${LABEL_BIND_ADDRESS:-127.0.0.1}:8000:8000"
    environment:
      LABEL_WORKER_INTERVAL_SECONDS: ${LABEL_WORKER_INTERVAL_SECONDS:-2}
      LABEL_DATABASE_URL: sqlite:////srv/labels/data/labels.db
      LABEL_PUBLIC_URL: ${LABEL_PUBLIC_URL:-http://localhost:8000}
    volumes:
      - label-data:/srv/labels/data
    restart: unless-stopped
    init: true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      start_period: 10s
      retries: 3

volumes:
  label-data:
