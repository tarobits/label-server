services:
  labels:
    build: .
    ports:
      - "${LABEL_BIND_ADDRESS:-127.0.0.1}:8000:8000"
    environment:
      LABEL_DATABASE_URL: sqlite:////srv/labels/data/labels.db
      LABEL_PRINTER_BACKEND: ${LABEL_PRINTER_BACKEND:-mock}
      LABEL_PRINTER_USB_SERIAL: ${LABEL_PRINTER_USB_SERIAL:-}
      LABEL_PRINTER_TIMEOUT_SECONDS: ${LABEL_PRINTER_TIMEOUT_SECONDS:-120}
      LABEL_PRINTER_FEED_MM: ${LABEL_PRINTER_FEED_MM:-2}
      LABEL_PRINTER_LEADER_MM: ${LABEL_PRINTER_LEADER_MM:-24.5}
      LABEL_PRINTER_CUT_EACH: ${LABEL_PRINTER_CUT_EACH:-true}
      LABEL_PRINTER_RESOLUTION: ${LABEL_PRINTER_RESOLUTION:-normal}
      LABEL_MOCK_TAPE_WIDTH_MM: ${LABEL_MOCK_TAPE_WIDTH_MM:-24}
      LABEL_NTFY_URL: ${LABEL_NTFY_URL:-}
      LABEL_NTFY_TOPIC: ${LABEL_NTFY_TOPIC:-}
      LABEL_NTFY_TOKEN: ${LABEL_NTFY_TOKEN:-}
      LABEL_PUBLIC_URL: ${LABEL_PUBLIC_URL:-http://localhost:8000}
    volumes:
      - label-data:/srv/labels/data
    restart: unless-stopped
    init: true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/status', timeout=5)"]
      interval: 30s
      timeout: 10s
      start_period: 10s
      retries: 3

volumes:
  label-data:
